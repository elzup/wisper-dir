[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wisper-dir"
version = "0.1.0"
description = "Batch transcribe audio files in a directory using OpenAI Whisper API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "elzup" }]
dependencies = ["openai>=1.0.0"]

[project.scripts]
wisper-dir = "wisper_dir.cli:main"
